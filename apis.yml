name: Semiconductor Manufacturing International Corporation (SMIC)

description: 'Semiconductor Manufacturing International Corporation (SMIC) is a leading semiconductor foundry based in China, providing advanced integrated circuit manufacturing services to global customers. Established in 2000, SMIC offers a range of process technologies, including 14nm, 28nm, and 40nm nodes, supporting applications in mobile, automotive, and IoT sectors. The company focuses on innovation, capacity expansion, and delivering high‑quality silicon solutions, positioning itself as a key player in the worldwide semiconductor supply chain.'

